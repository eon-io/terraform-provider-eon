name: Report Go installer result

on:
  repository_dispatch:
    types: [go-installer-result]

permissions:
  statuses: write

jobs:
  report:
    if: github.event.sender.id == 312122871 # eonterraform[bot]
    runs-on: ubuntu-latest
    steps:
      - name: Set commit status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.client_payload.sha }}
          STATE: ${{ github.event.client_payload.state }}
        run: |
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$STATE" == success || "$STATE" == failure ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f context='Go installer' -f state="$STATE" --silent
