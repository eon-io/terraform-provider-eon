# SDK capability sync: on every new eon-sdk-go release, bump the dependency,
# regenerate the capability gap report, and open a draft PR with the results.
#
# Triggers:
#   - repository_dispatch (event_type: sdk-release): fired by the SDK release
#     pipeline. Example:
#       curl -X POST -H "Authorization: Bearer $TOKEN" \
#         -H "Accept: application/vnd.github+json" \
#         https://api.github.com/repos/eon-io/terraform-provider-eon/dispatches \
#         -d '{"event_type":"sdk-release","client_payload":{"version":"v1.174.0"}}'
#   - schedule: daily fallback that compares the latest SDK release tag with
#     the version pinned in go.mod, in case the dispatch never arrived.
#   - workflow_dispatch: manual run, optionally pinning a version.
#
# The PR is always a draft and never merges automatically. If the optional
# SDK_SYNC_TOKEN secret (a PAT with repo scope) is configured it is used to
# push and open the PR so that CI runs on it; with the default GITHUB_TOKEN,
# GitHub suppresses workflow runs on the created PR and CI must be started by
# closing/reopening it or pushing to the branch.
name: SDK Capability Sync

on:
  repository_dispatch:
    types: [sdk-release]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'SDK version to sync to (e.g. v1.174.0). Empty = latest release.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SDK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Resolve SDK versions
        id: versions
        run: |
          CURRENT=$(go list -m -f '{{.Version}}' github.com/eon-io/eon-sdk-go)
          TARGET='${{ github.event.inputs.sdk_version || github.event.client_payload.version || '' }}'
          if [ -z "$TARGET" ]; then
            TARGET=$(go list -m -json github.com/eon-io/eon-sdk-go@latest | jq -r .Version)
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT — Target: $TARGET"

      - name: Check whether sync is needed
        id: gate
        run: |
          if [ "${{ steps.versions.outputs.current }}" = "${{ steps.versions.outputs.target }}" ]; then
            echo "Provider already on ${{ steps.versions.outputs.target }}; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="sdk-sync/${{ steps.versions.outputs.target }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          OPEN_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$OPEN_PR" != "0" ]; then
            echo "An open PR for $BRANCH already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.SDK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Bump SDK and regenerate gap report
        if: steps.gate.outputs.skip == 'false'
        run: |
          go get github.com/eon-io/eon-sdk-go@${{ steps.versions.outputs.target }}
          go mod tidy
          go run ./tools/capsync -update-manifest | tee /tmp/capsync-summary.txt

      - name: Build and test
        if: steps.gate.outputs.skip == 'false'
        run: |
          go vet ./...
          go build ./...
          go test ./...

      - name: Open draft PR
        if: steps.gate.outputs.skip == 'false'
        run: |
          BRANCH='${{ steps.gate.outputs.branch }}'
          TARGET='${{ steps.versions.outputs.target }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add go.mod go.sum capabilities/
          git commit -m "chore(deps): bump eon-sdk-go to $TARGET and refresh capability gap report"
          git push -u origin "$BRANCH"

          gh label create sdk-sync --description "Automated SDK dependency sync" --color 0E8A16 || true

          NEW_OPS=$(jq -r '[.operations[] | select(.new == true) | "- `\(.operation_id)` (`\(.method) \(.path)`) — proposed: \(.classification)"] | join("\n")' capabilities/gap-report.json)
          GAPS=$(jq -r '[.gaps[] | "- `\(.terraform_name)` (\(.classification)): \(.operation_ids | join(", "))"] | join("\n")' capabilities/gap-report.json)
          {
            echo "Automated SDK dependency bump to \`$TARGET\` with a refreshed capability gap report."
            echo
            echo "\`\`\`"
            cat /tmp/capsync-summary.txt
            echo "\`\`\`"
            echo
            if [ -n "$NEW_OPS" ]; then
              echo "### New SDK operations (triage seeded in capabilities/manifest.yaml — review the proposed classifications)"
              echo "$NEW_OPS"
              echo
            fi
            echo "### Open capability gaps"
            echo "${GAPS:-None}"
            echo
            echo "Full report: \`capabilities/gap-report.md\` on this branch."
            echo "To implement an approved gap, run the **Implement Capability** workflow with the capability name; each capability becomes its own draft PR chained off this one."
          } > /tmp/pr-body.md

          gh pr create --draft --label sdk-sync \
            --title "chore(deps): bump eon-sdk-go to $TARGET (capability sync)" \
            --body-file /tmp/pr-body.md
        env:
          GH_TOKEN: ${{ secrets.SDK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
